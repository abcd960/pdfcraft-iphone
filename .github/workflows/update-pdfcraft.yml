
name: Auto Update PdfCraft

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest PdfCraft release
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/storytold/pdfcraft/releases/latest \
            | jq -r '.assets[] | select(.name | startswith("pdfcraft-web-") and endswith(".zip")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ]; then
            echo "PdfCraft web ZIP not found"
            exit 1
          fi

          curl -fL "$URL" -o pdfcraft.zip
          mkdir -p "$RUNNER_TEMP/pdfcraft-site"
          unzip -q pdfcraft.zip -d "$RUNNER_TEMP/pdfcraft-site"
          test -f "$RUNNER_TEMP/pdfcraft-site/index.html"

      - name: Update repository files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$RUNNER_TEMP/pdfcraft-site/." .
          git add -A

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update PdfCraft to latest release"
            git push
          else
            echo "No repository changes detected"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy website
        uses: actions/deploy-pages@v4
